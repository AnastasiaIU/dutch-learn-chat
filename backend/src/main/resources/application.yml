spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dutch-learn-chat
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dutch_learn_chat}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  
  web:
    cors:
      allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:11434
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: '*'
      allow-credentials: true
      max-age: 3600

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-env}
  expiration: 86400000

automation:
  n8n:
    api-key: ${N8N_API_KEY:}

seed:
  dev-users:
    enabled: true

# AI Model Configuration
ai:
  # Provider selection: github | ollama
  provider: ollama
  
  # Ollama models: use 4-bit or 7-bit quantization for better quality
  # Available options: llama3.1:8b (default), llama3.1:8b-q4_K_M (4-bit, good balance)
  # Avoid q2_K (2-bit) - too aggressive quantization causes poor responses
  model: llama3.1:8b
  
  # Model variant tag for tracking experiments/versions
  model-tag: ${AI_MODEL_TAG:baseline-ollama}
  language-level: A2
  temperature: 0.4
  max-tokens: 320
  max-input-chars: 800
  max-history-chars: 2400
  request-timeout-seconds: 120

  # GitHub Models provider configuration
  # Set provider to "github" and configure these settings
  api-key: ${GITHUB_TOKEN:}
  
  # Ollama provider configuration
  # Set provider to "ollama" and configure these settings
  ollama:
    host: ${OLLAMA_HOST:http://localhost:11434}
  
  mock:
    enabled: false
  prompt:
    version: v1-a2b1-guardrails
  rag:
    enabled: true
    knowledge-base-path: rag/dutch-learning-kb.json
    max-context-items: 3
    max-snippet-chars: 220

cefr:
  vocabulary:
    path: cefr/NT2Lex-CGN+ODWN-v01.tsv
    format: tsv
    min-entries: 10000
  allowed-levels:
    a2: A1,A2
    b1: A1,A2,B1
  constraints:
    a2:
      max-sentence-length: 12
      disallowed-tokens: zou,zouden
    b1:
      max-sentence-length: 15
      disallowed-tokens:
  evaluation:
    max-unknown-words: 20

# Logging
logging:
  level:
    root: INFO
    com.dutchlearn: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
