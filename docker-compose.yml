version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dutch-learn-postgres
    environment:
      POSTGRES_DB: dutch_learn_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dutch-learn-postgres:/var/lib/postgresql/data

volumes:
  dutch-learn-postgres:
